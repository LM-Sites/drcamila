  <!-- Fundo circular -->
  <circle cx="200" cy="200" r="198" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.85"/>

  <!-- Texto superior -->
