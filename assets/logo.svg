  </text>

  <!-- Texto inferior -->
  <path id="botArc" d="M 92 205 A 108 108 0 0 0 308 205" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="6"
        fill="url(#gold)">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">CIRURGIÃ DENTISTA</textPath>
  </text>

  <!-- Monograma CM -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <!-- C -->
    <path d="M 205 135 A 55 62 0 1 0 205 262" stroke-width="9"/>
    <!-- M -->
    <path d="M 170 250 L 170 155 L 205 210 L 240 155 L 240 250" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <!-- Dente estilizado -->
  <path d="M 250 150 c 14 -6 30 2 30 20 c 0 14 -6 20 -9 30 c -2 7 -3 16 -8 16 c -4 0 -5 -8 -6 -12 c -1 -4 -6 -4 -7 0 c -1 4 -2 12 -6 12 c -5 0 -6 -9 -8 -16 c -3 -10 -9 -16 -9 -30 c 0 -16 12 -24 23 -20 z"
        fill="url(#gold)" opacity="0.95"/>
</svg>
