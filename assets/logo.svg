      <stop offset="0%" stop-color="#1a2238"/>
      <stop offset="70%" stop-color="#0f1526"/>
      <stop offset="100%" stop-color="#080b14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3c77a"/>
      <stop offset="45%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#9a7a34"/>
